<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="color-scheme" content="dark">
<title>Registrar · One Less One</title>
<link rel="stylesheet" href="./style.css?v=10.2.0">
<script defer src="./app.js?v=10.2.0"></script>
</head>
<body><main class="shell">
<header class="app-header"><div class="brand">One Less One</div><p>Registro rápido</p></header>
<section id="setup" class="setup" hidden>
<h1>Conectá tu iPhone</h1>
<p>Ingresá tu clave móvil.</p>
<form id="setupForm"><div class="field"><label for="mobileKey">Clave de registro móvil</label><input id="mobileKey" type="password" autocomplete="off" minlength="32" required placeholder="Pegá tu clave privada"></div>
<button type="submit" class="primary">Conectar iPhone</button></form>
</section>
<section id="capture" hidden aria-label="Nuevo registro">
<div class="section-heading"><h1>Registrar</h1></div>
<div class="type-switch" role="group" aria-label="Tipo de registro">
<button type="button" data-type="Gasto" class="selected" aria-pressed="true">Gasto</button>
<button type="button" data-type="Ingreso" aria-pressed="false">Ingreso</button>
<button type="button" data-type="Cobro" aria-pressed="false">Cobro</button>
</div>
<form id="entryForm">
<div class="amount-card"><label for="amount">Monto</label><div class="money"><span aria-hidden="true">₡</span><input id="amount" type="number" inputmode="decimal" min="0.01" max="1000000000" step="0.01" placeholder="0" autocomplete="off" required></div></div>
<div class="form-fields">
<div id="categoryField" class="field"><label for="categoryId">Categoría</label><select id="categoryId" required></select></div>
<div id="personField" class="field" hidden><label for="person">Persona</label><input id="person" type="text" maxlength="120" placeholder="Nombre de la persona"></div>
<div class="field"><div class="label-row"><label for="date">Fecha</label><button type="button" class="today-action" id="todayButton">Hoy</button></div><div class="date-control"><span class="date-display" id="dateDisplay" aria-hidden="true"></span><span class="date-chevron" aria-hidden="true">▾</span><input class="date-native" id="date" type="date" required aria-label="Fecha del movimiento"></div></div>
<div class="field"><label for="description" id="descriptionLabel">Detalle <span class="optional">(opcional)</span></label><input id="description" type="text" maxlength="200" placeholder="¿En qué fue?"></div>
<div class="field" id="dueField" hidden><label for="dueDate">Fecha esperada <span class="optional">(opcional)</span></label><div class="date-control"><span class="date-display" id="dueDateDisplay" aria-hidden="true">Seleccioná una fecha</span><span class="date-chevron" aria-hidden="true">▾</span><input class="date-native" id="dueDate" type="date" aria-label="Fecha esperada de pago"></div></div>
</div>
<button id="submit" class="primary" type="submit">Registrar gasto</button>
<button id="discardDraft" class="subtle-action" type="button" hidden>Descartar envío pendiente</button>
</form></section>
<p id="status" role="status" aria-live="polite" class="status"></p>
<footer id="connectedFooter" hidden>
<div class="footer-actions"><button type="button" id="refreshCatalog">Actualizar</button><button type="button" id="disconnect">Desvincular</button></div>

</footer>
</main></body></html>
