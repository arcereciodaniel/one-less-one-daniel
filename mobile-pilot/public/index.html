<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8f6"><title>Registrar · One Less One</title>
<link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script></head>
<body><main class="shell">
<header><div class="brand">one − one <span>mobile</span></div><p>Registro rápido de Daniel</p></header>
<section id="setup" class="setup" hidden><h2>Conectar iPhone</h2><p>Pegá la clave móvil creada en Cloudflare. Se guarda solo en este navegador del iPhone.</p>
<form id="setupForm"><label for="mobileKey">Clave de registro móvil</label><input id="mobileKey" type="password" autocomplete="off" minlength="32" required placeholder="Clave privada">
<button type="submit" class="primary">Conectar</button></form></section>
<section id="capture" hidden>
<div class="type-switch" role="group" aria-label="Tipo de movimiento">
<button type="button" data-type="Gasto" class="selected">Gasto</button>
<button type="button" data-type="Ingreso">Ingreso</button>
<button type="button" data-type="Pago deuda">Deuda</button>
<button type="button" data-type="Cobro">Cobro</button>
<button type="button" data-type="Aporte">Ahorro</button>
</div>
<form id="entryForm">
<div class="amount-row"><label for="amount">Monto en colones</label><div class="money"><span>₡</span><input type="number" inputmode="decimal" id="amount" min="0.01" max="1000000000" step="0.01" placeholder="0" required autofocus></div></div>
<div id="categoryField" class="field"><label for="categoryId">Categoría</label><select id="categoryId" required></select></div>
<div id="debtField" class="field" hidden><label for="debtId">Deuda</label><select id="debtId"></select></div>
<div id="goalField" class="field" hidden><label for="reserveId">Meta</label><select id="reserveId"></select><small>Es un aporte, no un gasto.</small></div>
<div id="personField" class="field" hidden><label for="person">Persona que te debe</label><input id="person" type="text" maxlength="120" placeholder="Nombre de la persona"></div>
<div class="field"><label for="date">Fecha</label><input id="date" type="date" required></div>
<div class="field"><label for="description" id="descriptionLabel">Detalle <span class="optional">(opcional)</span></label><input id="description" maxlength="200" placeholder="¿En qué fue?"></div>
<div class="field" id="dueField" hidden><label for="dueDate">¿Para cuándo esperás el pago? <span class="optional">(opcional)</span></label><input id="dueDate" type="date"></div>
<button id="submit" class="primary" type="submit">Registrar gasto</button>
<p id="status" role="status" aria-live="polite" class="status"></p>
</form>
</section>
<footer><button type="button" id="refreshCatalog">Actualizar opciones</button><button type="button" id="disconnect">Desvincular iPhone</button><p>Solo se envían nuevos registros. El historial completo permanece en One Less One Daniel.</p></footer>
</main></body></html>
