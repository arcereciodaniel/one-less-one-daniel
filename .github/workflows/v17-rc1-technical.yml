name: V17 RC1 technical integration
on:
  push:
    branches: [release/v17-0-rc1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install jsdom@26 --no-save --no-package-lock
      - run: node scripts/build-app.cjs --check
      - run: node scripts/build-lab.cjs --check
      - run: node --test tests/v17-rc1-native-bridge.test.cjs
      - run: node --test --test-concurrency=2 tests/*.test.cjs mobile-pilot/tests/*.test.mjs
      - run: node scripts/build-v17-rc1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: One-Less-One-V17.0-RC1-TECNICA
          path: preview-v17-rc1/
          if-no-files-found: error
          retention-days: 30
