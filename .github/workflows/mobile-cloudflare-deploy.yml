name: Publicar One Less One Movil en Cloudflare
on:
  push:
    branches: [main]
    paths:
      - "mobile-pilot/public/**"
      - "mobile-pilot/src/**"
      - "mobile-pilot/wrangler.jsonc"
      - "mobile-pilot/package.json"
      - "mobile-pilot/tests/**"
      - "mobile-pilot/scripts/**"
      - ".github/workflows/mobile-cloudflare-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: one-less-one-mobile-daniel-production
  cancel-in-progress: false
jobs:
  pruebas:
    name: Validar movil
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar Worker, interfaz y preparacion
        run: node --test mobile-pilot/tests/*.test.mjs
  desplegar:
    if: github.ref == 'refs/heads/main'
    name: Desplegar Worker existente
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar credenciales privadas
        id: ready
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$CF_D1_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales presentes. Preparando despliegue." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Publicacion pendiente: configura los 3 secretos Cloudflare en Settings > Secrets and variables > Actions. El Worker actual no se modifica." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preparar configuracion privada de D1
        if: steps.ready.outputs.enabled == 'true'
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node mobile-pilot/scripts/prepare-ci-config.mjs
      - name: Desplegar con Wrangler oficial
        if: steps.ready.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "mobile-pilot"
          command: "deploy --config wrangler.ci.jsonc"
      - name: Comprobar formulario publicado y API
        if: steps.ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://one-less-one-mobile-daniel.one-less-one-rastro.workers.dev"
          for attempt in 1 2 3 4 5; do
            # Evitar curl | grep -q bajo pipefail: grep cierra el pipe temprano
            # y curl puede terminar con error 23 aunque el Worker responda bien.
            if curl --fail --silent --show-error --max-time 20 "$url/api/health" -o "$RUNNER_TEMP/one-less-one-mobile-health.json" &&
               grep -q '"ok":true' "$RUNNER_TEMP/one-less-one-mobile-health.json"; then
              echo "El Worker responde correctamente." >> "$GITHUB_STEP_SUMMARY"
              curl --fail --silent --show-error --max-time 20 "$url/" -o "$RUNNER_TEMP/one-less-one-mobile-index.html"
              grep -q "One Less One" "$RUNNER_TEMP/one-less-one-mobile-index.html"
              echo "El formulario movil esta disponible." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "No se pudo validar el Worker publicado." >&2
          exit 1
