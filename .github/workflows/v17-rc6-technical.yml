name: V17 RC6 audit and visual validation
on:
  push:
    branches: [release/v17-0-rc6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install jsdom@26 --no-save --no-package-lock
      - run: node scripts/build-app.cjs --check
      - run: node scripts/build-lab.cjs --check
      - run: node --test tests/v17-rc6-debt-collection-links.test.cjs
      - run: node --test --test-concurrency=2 tests/*.test.cjs mobile-pilot/tests/*.test.mjs
      - run: node scripts/build-v17-rc6.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: One-Less-One-V17.0-RC6-TECNICA
          path: preview-v17-rc6/
          retention-days: 30
          if-no-files-found: error
      - run: npm install playwright@1.56.1 --no-save --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-v17-rc6-visual.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: V17-RC6-visual
          path: preview-v17-rc6/*.png
          retention-days: 30
          if-no-files-found: error
