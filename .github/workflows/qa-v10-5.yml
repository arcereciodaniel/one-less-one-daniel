name: QA V10.5 Cobros y reparto
on:
  push:
    branches: [qa/v10-5-split]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar jsdom
        run: npm install jsdom@26 --no-save --no-package-lock
      - name: Verificar Lab sincronizado
        run: node scripts/build-lab.cjs --check
      - name: Pruebas integradas financieras y escritorio
        run: |
          node tests/metas-render.test.cjs
          node tests/quincenas-metas-presupuesto.test.cjs
          node tests/movimientos-integrados.test.cjs
          node tests/formularios-v8.test.cjs
          node tests/tipo-cambio-deudas-v9.test.cjs
          node tests/mobile-pilot-v10.test.cjs
          node --test tests/lab-consolidation.test.cjs tests/v10-3-safety.test.cjs tests/v10-4-ledger.test.cjs tests/split-fare-v10-5.test.cjs
      - name: Pruebas del Worker y reparto móvil
        run: node --test mobile-pilot/tests/*.test.mjs
