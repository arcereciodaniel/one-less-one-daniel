name: QA V10.6–V10.7 Móvil y finanzas
on:
  push:
    branches: [qa/v10-6-shared-trips, qa/v10-7-mobile-crc-usd]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar pruebas
        run: npm install jsdom@26 --no-save --no-package-lock
      - name: Lab derivado de Daniel
        run: node scripts/build-lab.cjs --check
      - name: Motor contable y funcionalidad web
        run: |
          node tests/metas-render.test.cjs
          node tests/quincenas-metas-presupuesto.test.cjs
          node tests/movimientos-integrados.test.cjs
          node tests/formularios-v8.test.cjs
          node tests/tipo-cambio-deudas-v9.test.cjs
          node tests/mobile-pilot-v10.test.cjs
          node --test tests/lab-consolidation.test.cjs tests/v10-3-safety.test.cjs tests/v10-4-ledger.test.cjs tests/split-fare-v10-5.test.cjs tests/shared-groups-v10-6.test.cjs tests/mobile-split-ui-v10-5.test.cjs tests/mobile-group-ui-v10-6.test.cjs
      - name: Worker, privacidad y captura móvil
        run: node --test mobile-pilot/tests/*.test.mjs
