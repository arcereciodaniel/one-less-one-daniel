name: V17 mobile bridge verification (no deployment)
on:
  push:
    branches: [release/v17-0-prerelease]
    paths:
      - "src/experimental/v17-mobile-bridge.cjs"
      - "tests/v17-mobile-bridge.test.cjs"
      - "scripts/build-v17-mobile-bridge.cjs"
      - "scripts/build-v17-staging.cjs"
      - "scripts/build-v17-prerelease.cjs"
      - "src/experimental/v17-parity-actions.js"
      - "src/experimental/v17-reconciled-forecast.cjs"
      - "src/experimental/v17-commitment-links.cjs"
      - "src/experimental/v17-debt-collection-links.cjs"
      - "src/experimental/v17-mobile-bridge-ui.js"
      - "mobile-pilot/staging/**"
      - ".github/workflows/v17-mobile-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/release/v17-0-prerelease'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install jsdom@26 --no-save --no-package-lock
      - run: node --test tests/v17-mobile-bridge.test.cjs tests/v17-prerelease.test.cjs tests/v17-rc8-continuity.test.cjs mobile-pilot/staging/staging.test.mjs
      - run: node scripts/build-v17-mobile-bridge.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: OLO-V17-MOBILE-BRIDGE-SYNTHETIC
          path: preview-v17-mobile-bridge/
          if-no-files-found: error
          retention-days: 14
