name: V16.3 universal assignment editor
on:
  push:
    branches: [dev/v16-3-universal-editor]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install jsdom@26 --no-save --no-package-lock
      - run: node scripts/build-app.cjs --check
      - run: node scripts/build-lab.cjs --check
      - run: node --test tests/v16-1-flexible-system.test.cjs tests/v16-2-financial-assignments.test.cjs tests/v16-3-assignment-editor.test.cjs
      - run: node --test --test-concurrency=2 tests/*.test.cjs mobile-pilot/tests/*.test.mjs
      - run: node scripts/build-v16-3-preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: One-Less-One-V16.3-DEMO
          path: preview-v16-3/
          if-no-files-found: error
          retention-days: 30
