<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; form-action 'none'; base-uri 'none'"><title>One Less One · V16.1 DEMO</title><style>/* OLO_NATIVE_CSS */
body.olo-demo{margin:0;background:var(--bg);color:var(--text)}.olo-demo .demo-header{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--border)}.olo-demo .demo-header-inner{max-width:1320px;margin:auto;padding:14px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.olo-demo .demo-brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.olo-demo .demo-wordmark{font-size:1.15rem;font-weight:750;letter-spacing:-.045em}.olo-demo .demo-nav,.olo-demo .demo-utility,.olo-demo .demo-filter,.olo-demo .demo-scope{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.olo-demo .demo-utility{justify-content:flex-end}.olo-demo .demo-nav button,.olo-demo .demo-utility button,.olo-demo .demo-filter button,.olo-demo .demo-scope button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:8px 12px;white-space:nowrap;cursor:pointer;font:inherit}.olo-demo button[aria-pressed=true]{background:var(--surface-2);color:var(--text);border-color:var(--border);font-weight:650}.olo-demo button:focus-visible,.olo-demo select:focus-visible,.olo-demo input:focus-visible{outline:2px solid var(--text);outline-offset:2px}.olo-demo .demo-main{max-width:1180px;margin:0 auto;padding:30px 24px 64px;width:100%;box-sizing:border-box}.olo-demo .demo-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}.olo-demo h1{font-size:1.65rem;letter-spacing:-.04em;margin:0}.olo-demo h2{font-size:1rem;margin:0}.olo-demo .demo-filter{border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--surface);margin:0 0 18px;gap:8px}.olo-demo .demo-filter select,.olo-demo .demo-filter input{width:auto;min-width:0;margin:0;max-width:100%;font:inherit}.olo-demo .demo-filter .demo-spacer{flex:1}.olo-demo .demo-interval{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;gap:12px}.olo-demo .demo-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 14px}.olo-demo .demo-kpis .v7-kpi{padding:16px;display:block}.olo-demo .demo-kpis .v7-kpi-value{font-size:1.35rem}.olo-demo .demo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:14px;align-items:start}.olo-demo .demo-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px;min-width:0}.olo-demo .demo-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.olo-demo .demo-card-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:13px;border-bottom:1px solid var(--border)}.olo-demo .demo-card-totals small,.olo-demo .demo-card-totals strong{display:block;white-space:nowrap}.olo-demo .demo-card-totals strong{font-size:clamp(.8rem,1.4vw,1.05rem);font-variant-numeric:tabular-nums}.olo-demo .demo-row{padding:10px 0;border-bottom:1px solid var(--border)}.olo-demo .demo-row:last-child{border-bottom:0}.olo-demo .demo-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.olo-demo .demo-row-top strong{font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}.olo-demo .demo-bar{height:5px;background:var(--surface-2);border-radius:10px;overflow:hidden;margin:6px 0 0}.olo-demo .demo-bar span{height:100%;display:block;background:var(--muted);border-radius:inherit}.olo-demo .demo-section{margin-top:14px}.olo-demo .demo-section h3{font-size:.72rem;color:var(--muted);font-weight:650;margin:0 0 3px}.olo-demo .demo-chip{font-size:.7rem;color:var(--muted)}.olo-demo .demo-add{font:inherit;cursor:pointer;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 9px}.olo-demo .demo-danger{color:var(--danger)}.olo-demo .demo-feed{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}.olo-demo .demo-feed-row{display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:12px 0}.olo-demo .demo-feed-row:last-child{border-bottom:0}.olo-demo .demo-footer{color:var(--muted);font-size:.72rem;margin-top:24px}.olo-demo dialog{max-width:min(420px,90vw);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:22px}.olo-demo dialog label{display:block;margin:12px 0 5px}.olo-demo dialog input,.olo-demo dialog select{width:100%}.olo-demo .demo-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.olo-demo .demo-chart{display:grid;gap:8px}.olo-demo .demo-chart-row{display:grid;grid-template-columns:minmax(115px,1fr) 2fr auto;align-items:center;gap:12px}.olo-demo .demo-chart-row .demo-bar{margin:0;height:9px}.olo-demo .demo-empty{color:var(--muted);padding:16px 0}.olo-demo .demo-filter button:hover,.olo-demo .demo-nav button:hover{background:var(--surface-2);color:var(--text)}@media(max-width:700px){.olo-demo .demo-header-inner{grid-template-columns:1fr auto;padding:12px 16px}.olo-demo .demo-nav{grid-column:1/-1;grid-row:2;overflow-x:auto;flex-wrap:nowrap}.olo-demo .demo-main{padding:20px 14px}.olo-demo .demo-kpis{gap:6px}.olo-demo .demo-kpis .v7-kpi{padding:10px}.olo-demo .demo-kpis .v7-kpi-value{font-size:1rem}.olo-demo .demo-filter .demo-spacer{display:none}.olo-demo .demo-filter{gap:5px}.olo-demo .demo-feed-row{grid-template-columns:72px minmax(0,1fr) auto}.olo-demo .demo-chart-row{grid-template-columns:1fr 1fr auto}.olo-demo .demo-filter select{max-width:100%}}
</style></head><body class="olo-demo" data-theme="dark">
<header class="demo-header"><div class="demo-header-inner"><div class="demo-brand"><span class="demo-wordmark">One Less One</span><small class="brand-version">V16.1 DEMO</small></div><nav class="demo-nav" aria-label="Módulos"><button data-module="home" aria-pressed="true">Inicio</button><button data-module="budget" aria-pressed="false">Presupuesto</button><button data-module="moves" aria-pressed="false">Movimientos</button><button data-module="future" aria-pressed="false">Futuro</button><button data-module="projects" aria-pressed="false">Proyectos</button></nav><div class="demo-utility"><button id="theme" aria-label="Cambiar tema">Claro / oscuro</button></div></div></header>
<div class="demo-main"><div class="demo-heading"><div><h1 id="title">Tu panorama financiero</h1><small class="muted" id="moduleNote"></small></div></div>
<div class="demo-filter" aria-label="Período financiero"><select id="level" aria-label="Intervalo"><option value="week">Semana</option><option value="fortnight">Quincena</option><option value="month">Mes</option><option value="quarter">Trimestre</option><option value="half">Semestre</option><option value="year">Año</option></select><button id="prev" aria-label="Período anterior">‹</button><input type="month" id="month" aria-label="Mes de referencia"><button id="next" aria-label="Período siguiente">›</button><select id="slot" aria-label="Período dentro del mes"></select><span class="demo-spacer"></span><div class="demo-scope"><button id="all" aria-pressed="true">Todos</button><button id="current" aria-pressed="false">Actual</button></div></div>
<div id="content"></div><div class="demo-footer">Prototipo funcional · Datos ficticios · Hoy simulado: 19 dic. 2026 · Sin conexión ni almacenamiento. Los períodos de este prototipo son calendario; no se modifican las quincenas financieras históricas.</div></div>
<dialog id="edit"><form id="editForm"><h2>Asignar presupuesto</h2><label for="category">Categoría</label><select id="category" required></select><label for="date">Fecha</label><input id="date" type="date" required><label for="amount">Monto CRC</label><input id="amount" type="number" min="1" max="100000000" step="1" required><p class="muted" id="editHint"></p><div class="demo-dialog-actions"><button class="btn secondary" id="cancel" type="button">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form></dialog>
<script>/* OLO_TEMPORAL_CORE */
const ledger=/* OLO_DEMO_LEDGER */,T=oneV16Temporal,TODAY="2026-12-19",el=id=>document.getElementById(id);
let state={month:"2026-12",level:"week",scope:"all",anchor:TODAY},moduleName="home",editing=null,seq=0;
const f=n=>new Intl.NumberFormat("es-CR",{style:"currency",currency:"CRC",maximumFractionDigits:0}).format(n);
const short=d=>new Intl.DateTimeFormat("es-CR",{day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(d+"T00:00:00Z"));
const mlabel=m=>new Intl.DateTimeFormat("es-CR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(m+"-01T00:00:00Z"));
const label=r=>short(r.start)+" – "+short(r.end)+(r.start.slice(0,4)!==r.end.slice(0,4)?" "+r.end.slice(0,4):"");
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function active(s){return s.scope==="single"&&s.month===TODAY.slice(0,7)&&T.select(s).some(r=>T.contains(r,TODAY))}
function kpis(p){return '<div class="demo-kpis">'+[["Presupuesto",p.outflow.planned],["Ejecutado",p.outflow.actual],["Restante neto",p.outflow.planned-p.outflow.actual]].map(([n,v])=>'<div class="v7-kpi"><div class="v7-kpi-label">'+n+'</div><div class="v7-kpi-value">'+f(v)+'</div></div>').join("")+'</div>'}
function rangeTotal(rs){return T.project(ledger,{start:rs[0].start,end:rs.at(-1).end})}
function row(r,range,editable){const pending=r.planned===0&&!r.unplanned&&r.actual>0;return '<div class="demo-row"><div class="demo-row-top"><div>'+esc(r.name)+(r.unplanned?'<div class="demo-chip">Sin presupuesto</div>':pending?'<div class="demo-chip">Pendiente de asignación</div>':'')+'</div><strong>'+f(r.actual)+' / '+f(r.planned)+'</strong>'+(editable?'<button class="demo-add" data-add="'+esc(r.id)+'" data-range="'+range.key+'" aria-label="Asignar presupuesto a '+esc(r.name)+'">＋</button>':'')+'</div>'+(r.planned?'<div class="demo-bar"><span style="width:'+Math.min(100,r.actual/r.planned*100)+'%"></span></div>':'')+'</div>'}
function card(range,editable){const p=T.project(ledger,range);return '<article class="demo-card"><div class="demo-card-head"><div><h2>'+label(range)+'</h2>'+(T.contains(range,TODAY)?'<small class="demo-chip">Actual</small>':'')+'</div>'+(editable?'<button class="demo-add" data-add="" data-range="'+range.key+'">＋ Asignar</button>':'')+'</div><div class="demo-card-totals">'+[["Presupuesto",p.outflow.planned],["Ejecutado",p.outflow.actual],["Restante",p.outflow.planned-p.outflow.actual]].map(([n,v])=>'<div><small class="muted">'+n+'</small><strong>'+f(v)+'</strong></div>').join("")+'</div>'+[["Ingresos",p.rows.filter(r=>r.type==="Ingreso")],["Gastos, deudas y ahorro",p.rows.filter(r=>r.type!=="Ingreso")]].filter(([,rs])=>rs.length).map(([n,rs])=>'<section class="demo-section"><h3>'+n+'</h3>'+rs.map(r=>row(r,range,editable)).join("")+'</section>').join("")+(!p.rows.length?'<div class="demo-empty">Sin asignaciones ni movimientos</div>':'')+'</article>'}
function pending(p){return p.pending.length?'<div class="demo-card"><h2>Pendiente de distribuir</h2>'+p.pending.map(a=>'<div class="demo-row"><div class="demo-row-top"><span>'+esc(ledger.categories.find(c=>c.id===a.categoryId).name)+' · '+short(a.start)+' – '+short(a.end)+'</span><strong>'+f(a.amount)+'</strong></div></div>').join("")+'<small class="muted">No se incluye en el subtotal del intervalo seleccionado hasta asignarle una fecha.</small></div>':''}
function render(){
 const rs=T.select(state),p=rangeTotal(rs),available=T.partitions(state.month,state.level);
 el("level").value=state.level;el("month").value=state.month;el("slot").replaceChildren(...available.map(r=>{const o=document.createElement("option");o.value=r.start;o.textContent=label(r);return o}));el("slot").hidden=available.length<2;el("slot").value=(available.find(r=>T.contains(r,state.anchor))||available[0]).start;el("all").setAttribute("aria-pressed",String(state.scope==="all"));el("current").setAttribute("aria-pressed",String(active(state)));
 document.querySelectorAll("[data-module]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.module===moduleName)));
 el("title").textContent=({home:"Tu panorama financiero",budget:"Presupuesto",moves:"Movimientos",future:"Futuro",projects:"Proyectos"})[moduleName];
 el("moduleNote").textContent=({home:"Estado por categoría",budget:"Planificación y control",moves:"Historial de movimientos",future:"Exploración temporal · prototipo",projects:"Viaje de ejemplo · prototipo"})[moduleName];
 const heading='<div class="demo-interval"><h2>'+esc(mlabel(state.month))+'</h2><small class="muted">'+label({start:rs[0].start,end:rs.at(-1).end})+'</small></div>';
 if(moduleName==="budget"){const aggregatePending=p.pending;const splitPending=rs.length>1?rs.flatMap(r=>T.project(ledger,r).pending):[];const unique=[...new Map([...aggregatePending,...splitPending].map(a=>[a.id,a])).values()];el("content").innerHTML=kpis(p)+heading+'<div class="demo-cards">'+rs.map(r=>card(r,true)).join("")+'</div>'+(unique.length?'<div style="margin-top:14px">'+pending({pending:unique})+'</div>':'')}
 else if(moduleName==="home"){el("content").innerHTML=kpis(p)+heading+'<div class="demo-card"><h2>Estado por categoría</h2>'+p.rows.map(r=>row(r,{key:""},false)).join("")+(!p.rows.length?'<div class="demo-empty">Sin actividad</div>':'')+'</div>'+pending(p)+'<div class="demo-interval"><h2>Presupuesto vs. real</h2></div><div class="demo-cards">'+rs.map(r=>card(r,false)).join("")+'</div>'}
 else if(moduleName==="moves"){el("content").innerHTML=kpis(p)+heading+'<div class="demo-feed">'+(p.movements.length?[...p.movements].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>'<div class="demo-feed-row"><small class="muted">'+short(m.date)+'</small><div><strong>'+esc(m.description)+'</strong><div class="demo-chip">'+esc(ledger.categories.find(c=>c.id===m.categoryId).name)+'</div></div><strong>'+f(m.amount)+'</strong></div>').join(""):'<div class="demo-empty">Sin movimientos registrados en este período.</div>')+'</div>'}
 else{el("content").innerHTML=heading+'<div class="demo-card"><h2>'+ (moduleName==="future"?"Asignaciones futuras":"Calendario de viaje")+'</h2><p class="muted">'+(moduleName==="future"?"Demostración de navegación, no proyección de liquidez real.":"Demostración de navegación, no presupuesto de proyecto conectado.")+'</p>'+rs.map(r=>'<div class="demo-row">'+label(r)+'</div>').join("")+'</div>'}
}
el("level").onchange=e=>{state=T.changeLevel(state,e.target.value);render()};el("month").onchange=e=>{if(!e.target.value)return;state=T.changeMonth(state,e.target.value);render()};el("slot").onchange=e=>{state={...state,anchor:e.target.value,scope:"single"};render()};el("prev").onclick=()=>{state=T.navigate(state,-1);render()};el("next").onclick=()=>{state=T.navigate(state,1);render()};el("all").onclick=()=>{state={...state,scope:"all"};render()};el("current").onclick=()=>{state=T.current(state.level,TODAY);render()};document.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>{moduleName=b.dataset.module;render()});
el("theme").onclick=()=>{const next=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=next;document.body.dataset.theme=next};
el("content").onclick=e=>{const b=e.target.closest("[data-add]");if(!b)return;const [start,end]=b.dataset.range.split("/");editing={start,end};el("category").replaceChildren(...ledger.categories.map(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;return o}));if(b.dataset.add)el("category").value=b.dataset.add;el("date").min=start;el("date").max=end;el("date").value=T.contains(editing,TODAY)?TODAY:start;el("amount").value="";el("editHint").textContent="Nueva asignación en esta fecha; se suma al presupuesto existente. Solo datos de prueba.";el("edit").showModal()};
el("cancel").onclick=()=>{editing=null;el("edit").close()};el("editForm").onsubmit=e=>{e.preventDefault();const amount=Number(el("amount").value),date=el("date").value;if(!editing||!T.contains(editing,date)||!Number.isSafeInteger(amount)||amount<=0||!ledger.categories.some(c=>c.id===el("category").value))return;ledger.allocations.push({id:"demo-new-"+(++seq),categoryId:el("category").value,date,amount});editing=null;el("edit").close();render()};
document.documentElement.dataset.theme="dark";render();
</script></body></html>
